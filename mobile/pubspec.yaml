name: food_delivery
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  otp_pin_field: ^1.5.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.8
  google_maps_flutter: ^2.5.3
  custom_map_markers: ^0.0.2+1
  http: ^1.2.0
  flutter_easyloading: ^3.0.5
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_timezone: ^3.0.1
  get_it: ^7.6.7
  socket_io_client: ^3.0.2

  # Map & Routing dependencies from api_google
  flutter_map: ^8.3.0
  latlong2: ^0.10.1
  geolocator: ^11.0.0
  provider: ^6.1.2
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    - family: Metropolis
      fonts:
        - asset: assets/font/Metropolis-Regular.otf
        - asset: assets/font/Metropolis-Medium.otf
          weight: 500
        - asset: assets/font/Metropolis-SemiBold.otf
          weight: 600
        - asset: assets/font/Metropolis-Bold.otf
          weight: 700
        - asset: assets/font/Metropolis-ExtraBold.otf
          weight: 800
