name: "datthucan"

services:
  # NestJS Backend API Service
  # Connecting directly to your existing PostgreSQL container (my-new-postgres on port 5432)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datthucan_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: "123456"
      DB_DATABASE: postgres
      DB_SYNCHRONIZE: "false"
      JWT_SECRET: super_secret_key_smart_city_food_route_2026
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: super_refresh_secret_key_2026
      JWT_REFRESH_EXPIRES_IN: 30d
    extra_hosts:
      - "host.docker.internal:host-gateway"
