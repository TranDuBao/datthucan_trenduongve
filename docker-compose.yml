name: "datthucan"

services:
  # NestJS Backend API Service
  # Connecting directly to your existing PostgreSQL container (my-new-postgres on port 5432)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datthucan_backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_SYNCHRONIZE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
